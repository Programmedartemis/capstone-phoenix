apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: taskapp
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: backend-migration
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc
          imagePullPolicy: IfNotPresent

          command:
            - alembic
          args:
            - upgrade
            - head

          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_USER

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_PASSWORD

            - name: DATABASE_HOST
              value: "postgres"

            - name: DATABASE_PORT
              value: "5432"

            - name: DATABASE_NAME
              value: "taskapp"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi