---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - apt-transport-https
    state: present

- name: Ensure UFW is not enabled
  ansible.builtin.service:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false
